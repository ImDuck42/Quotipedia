<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Open Graph -->
  <meta property="og:title"        content="Quotipedia" />
  <meta property="og:description"  content="A quote sharing site with an unsecure account system" />
  <meta property="og:image"        content="https://raw.githubusercontent.com/ImDuck42/Quotipedia/refs/heads/main/image/image.png" />
  <meta property="og:image:width"  content="1920" />
  <meta property="og:image:height" content="1080" />

  <title>Quotipedia</title>
  <link rel="icon" type="image/svg+xml" href="./image/quote-svgrepo.svg" sizes="any">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- ══ Site header ══════════════════════════════════════════════ -->
  <header id="siteHeader">
    <a class="logo" href="#">Quotipedia</a>
    <nav id="navArea" aria-label="User navigation">
      <button class="btn"              id="loginBtn">Sign in</button>
      <button class="btn btn-primary"  id="registerBtn">Join free</button>
    </nav>
  </header>

  <!-- ══ Main content ═════════════════════════════════════════════ -->
  <main>

    <!-- Hero + quote submit panel -->
    <div class="top-section">

      <div class="hero">
        <h1>A place for <em>quotes</em><br />that matter</h1>
        <p class="hero-sub">Share the words that moved you. Curated by the community, for the community.</p>
        <p class="hero-sub">It's that deep bro \[°_°]/</p>
      </div>

      <section id="submitPanel" aria-label="Share a quote">
        <h3>Share a quote</h3>
        <div class="field">
          <label for="qText">The quote</label>
          <textarea id="qText" placeholder="The words themselves…"></textarea>
        </div>
        <div class="field">
          <label for="qAuthor">Attributed to <span class="optional">(optional)</span></label>
          <input type="text" id="qAuthor" placeholder="e.g. Marcus Aurelius" />
        </div>
        <div class="field">
          <label for="qTags">Tags <span class="optional">(optional, comma-separated, max 5)</span></label>
          <input type="text" id="qTags" placeholder="e.g. pls, just, don't" />
        </div>
        <div class="submit-row">
          <span id="submitMsg" aria-live="polite"></span>
          <button class="btn btn-primary" id="submitQuoteBtn">Publish quote</button>
        </div>
      </section>

    </div>

    <!-- Feed header -->
    <div class="feed-header">
      <h2>Latest quotes</h2>
      <span class="feed-count" id="feedCount" aria-live="polite"></span>
    </div>

    <!-- Search / tag filter bar (rendered by JS) -->
    <div id="searchBar" role="search"></div>

    <!-- Quote cards -->
    <div id="feed" class="quotes-grid" aria-live="polite">
      <div class="loading">Loading quotes</div>
    </div>

  </main>

  <!-- ══ Auth modal ═══════════════════════════════════════════════ -->
  <div class="modal-backdrop" id="authModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <button class="modal-close" id="modalCloseBtn" aria-label="Close">✕</button>
      <h2 id="modalTitle">Welcome back</h2>

      <div class="field">
        <label for="authUser">Username</label>
        <input type="text" id="authUser" placeholder="your_username" autocomplete="username" />
      </div>
      <div class="field">
        <label for="authPass">Password</label>
        <input type="password" id="authPass" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <div id="authError" role="alert" aria-live="assertive"></div>

      <div class="modal-footer">
        <button class="btn btn-primary" id="authSubmitBtn">Sign in</button>
        <p class="modal-switch" id="modalSwitch">
          No account? <a id="modalToggleLink">Create one</a>
        </p>
      </div>
    </div>
  </div>

  <!-- ══ Profile overlay ══════════════════════════════════════════ -->
  <div id="profileView" role="dialog" aria-modal="true" aria-label="User profile">
    <div class="pv-inner">
      <button class="pv-close" id="pvCloseBtn" aria-label="Close profile">✕</button>
      <div class="pv-loading">Loading profile</div>
    </div>
  </div>

  <!-- ══ Edit profile modal ════════════════════════════════════════ -->
  <div class="modal-backdrop" id="editProfileModal" role="dialog" aria-modal="true" aria-labelledby="epTitle">
    <div class="modal modal-wide">
      <button class="modal-close" id="epCloseBtn" aria-label="Close">✕</button>
      <h2 id="epTitle">Edit profile</h2>

      <div class="ep-grid">
        <div class="field">
          <label for="epAvatar">Avatar URL</label>
          <input type="text" id="epAvatar" placeholder="https://…" />
        </div>
        <div class="field">
          <label for="epBanner">Banner URL</label>
          <input type="text" id="epBanner" placeholder="https://…" />
        </div>
      </div>

      <div class="field">
        <label for="epBio">Bio <span class="optional">(max 200 chars)</span></label>
        <textarea id="epBio" placeholder="A few words about yourself…" rows="3"></textarea>
      </div>

      <p class="ep-socials-label">Socials</p>
      <div class="ep-socials-grid">
        <div class="field ep-social-field">
          <label for="epTwitter">Twitter / X</label>
          <input type="text" id="epTwitter" placeholder="https://x.com/…" />
        </div>
        <div class="field ep-social-field">
          <label for="epGithub">GitHub</label>
          <input type="text" id="epGithub" placeholder="https://github.com/…" />
        </div>
        <div class="field ep-social-field">
          <label for="epInstagram">Instagram</label>
          <input type="text" id="epInstagram" placeholder="https://instagram.com/…" />
        </div>
        <div class="field ep-social-field">
          <label for="epYoutube">YouTube</label>
          <input type="text" id="epYoutube" placeholder="https://youtube.com/…" />
        </div>
        <div class="field ep-social-field">
          <label for="epWebsite">Website</label>
          <input type="text" id="epWebsite" placeholder="https://…" />
        </div>
      </div>

      <div id="epError" role="alert" aria-live="assertive"></div>

      <div class="modal-footer ep-footer">
        <button class="btn"             id="epCancelBtn">Cancel</button>
        <button class="btn btn-primary" id="epSaveBtn">Save</button>
      </div>
    </div>
  </div>

  <!-- ══ Toast notifications ══════════════════════════════════════ -->
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>

</html>
