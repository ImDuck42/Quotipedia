<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Open Graph -->
  <meta property="og:title"        content="Quotipedia">
  <meta property="og:description"  content="A quote sharing site with an unsecure account system">
  <meta property="og:image"        content="https://raw.githubusercontent.com/ImDuck42/Quotipedia/refs/heads/main/image/image.png">
  <meta property="og:image:width"  content="1920">
  <meta property="og:image:height" content="1080">

  <title>Quotipedia</title>
  <link rel="icon" type="image/svg+xml" href="./image/quote-svgrepo.svg" sizes="any">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- ══ Site header ══════════════════════════════════════════════ -->
  <header id="site-header">
    <a class="logo" href="#">Quotipedia</a>
    <nav id="nav-area" aria-label="User navigation">
      <button class="btn"             id="login-btn">Sign in</button>
      <button class="btn btn-primary" id="register-btn">Join free</button>
    </nav>
  </header>

  <!-- ══ Main content ═════════════════════════════════════════════ -->
  <main>

    <!-- Hero + quote submit panel -->
    <div class="top-section">

      <div class="hero">
        <h1>A place for <em>quotes</em><br>that 'matter'</h1>
        <p class="hero-sub">Share the ascii characters that moved you. Curated by the humans, for the humans.</p>
        <p class="hero-sub">It's that deep bro \{-_-}/</p>
      </div>

      <section id="submit-panel" aria-label="Share a quote">
        <h3>Share a quote</h3>
        <div class="field">
          <label for="quote-text">The quote</label>
          <textarea id="quote-text" placeholder="The words themselves…"></textarea>
        </div>
        <div class="field">
          <label for="quote-author">Attributed to <span class="optional">(optional)</span></label>
          <input type="text" id="quote-author" placeholder="e.g. Marcus Aurelius">
        </div>
        <div class="field">
          <label for="quote-tags">Tags <span class="optional">(optional, comma-separated, max 5)</span></label>
          <input type="text" id="quote-tags" placeholder="e.g. pls, just, don't">
        </div>
        <div class="submit-row">
          <span id="submit-msg" aria-live="polite"></span>
          <button class="btn btn-primary" id="submit-quote-btn">Publish quote</button>
        </div>
      </section>

    </div>

    <!-- Feed header -->
    <div class="feed-header">
      <h2>Latest quotes</h2>
      <span class="feed-count" id="feed-count" aria-live="polite"></span>
    </div>

    <!-- Search / tag filter bar (rendered by JS) -->
    <div id="search-bar" role="search"></div>

    <!-- Quote cards -->
    <div id="quote-feed" class="quotes-grid" aria-live="polite">
      <div class="loading">Loading quotes</div>
    </div>

  </main>

  <!-- ══ Auth modal ═══════════════════════════════════════════════ -->
  <div class="modal-backdrop" id="auth-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <button class="modal-close" id="modal-close-btn" aria-label="Close">✕</button>
      <h2 id="modal-title">Welcome back</h2>

      <form id="auth-form" onsubmit="return false">
        <div class="field">
          <label for="auth-user">Username</label>
          <input type="text" id="auth-user" placeholder="your_username" autocomplete="username">
        </div>
        <div class="field">
          <label for="auth-pass">Password</label>
          <input type="password" id="auth-pass" placeholder="••••••••" autocomplete="current-password">
        </div>

        <div id="auth-error" role="alert" aria-live="assertive"></div>

        <div class="modal-footer">
          <button class="btn btn-primary" id="auth-submit-btn" type="submit">Sign in</button>
          <p class="modal-switch" id="modal-switch">
            No account? <a id="modal-toggle-link">Create one</a>
          </p>
        </div>
      </form>
    </div>
  </div>

  <!-- ══ Profile overlay ══════════════════════════════════════════ -->
  <div id="profile-view" role="dialog" aria-modal="true" aria-label="User profile">
    <div class="pv-inner">
      <button class="pv-close" id="pv-close-btn" aria-label="Close profile">✕</button>
      <div class="pv-loading">Loading profile</div>
    </div>
  </div>

  <!-- ══ Edit profile modal ════════════════════════════════════════ -->
  <div class="modal-backdrop" id="edit-profile-modal" role="dialog" aria-modal="true" aria-labelledby="ep-title">
    <div class="modal modal-wide">
      <button class="modal-close" id="ep-close-btn" aria-label="Close">✕</button>
      <h2 id="ep-title">Edit profile</h2>

      <div class="ep-grid">
        <div class="field">
          <label for="ep-avatar-file">Avatar <span class="optional">(image file)</span></label>
          <div class="ep-upload-wrap">
            <input type="file" id="ep-avatar-file" accept="image/*" class="ep-file-input">
            <label for="ep-avatar-file" class="ep-file-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span id="ep-avatar-label">Choose avatar…</span>
            </label>
            <div class="ep-img-preview" id="ep-avatar-preview"></div>
          </div>
        </div>
        <div class="field">
          <label for="ep-banner-file">Banner <span class="optional">(image file)</span></label>
          <div class="ep-upload-wrap">
            <input type="file" id="ep-banner-file" accept="image/*" class="ep-file-input">
            <label for="ep-banner-file" class="ep-file-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span id="ep-banner-label">Choose banner…</span>
            </label>
            <div class="ep-img-preview ep-img-preview-banner" id="ep-banner-preview"></div>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="ep-bio">Bio <span class="optional">(max 200 chars)</span></label>
        <textarea id="ep-bio" placeholder="A few words about yourself…" rows="3"></textarea>
      </div>

      <p class="ep-socials-label">Socials</p>
      <div class="ep-socials-grid">
        <div class="field ep-social-field">
          <label for="ep-twitter">Twitter / X</label>
          <input type="text" id="ep-twitter" placeholder="https://x.com/…">
        </div>
        <div class="field ep-social-field">
          <label for="ep-github">GitHub</label>
          <input type="text" id="ep-github" placeholder="https://github.com/…">
        </div>
        <div class="field ep-social-field">
          <label for="ep-instagram">Instagram</label>
          <input type="text" id="ep-instagram" placeholder="https://instagram.com/…">
        </div>
        <div class="field ep-social-field">
          <label for="ep-youtube">YouTube</label>
          <input type="text" id="ep-youtube" placeholder="https://youtube.com/…">
        </div>
        <div class="field ep-social-field">
          <label for="ep-website">Website</label>
          <input type="text" id="ep-website" placeholder="https://…">
        </div>
      </div>

      <div id="ep-error" role="alert" aria-live="assertive"></div>

      <div class="modal-footer ep-footer">
        <button class="btn"             id="ep-cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="ep-save-btn">Save</button>
      </div>
    </div>
  </div>

  <!-- ══ Toast notifications ══════════════════════════════════════ -->
  <div id="toast-msg" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>

</html>
