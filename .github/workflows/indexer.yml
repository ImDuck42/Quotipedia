# Created for Testing by Claude Sonnet 4.6

name: Merge Index Updates

on:
  push:
    # Trigger on any .json file change anywhere in the repo.
    # The script below will discover all relevant directories dynamically —
    # no hardcoded basePath, works with collections, subcollections, _kv, _auth, etc.
    paths:
      - '**.json'

# Cancel any in-progress run for the same branch when a new push comes in.
# The new run picks up all accumulated changes at that point — this is the
# core debounce mechanism that prevents _index.json overload.
concurrency:
  group: merge-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── Dynamically discover and rebuild all _index.json files ─────────────
      # Pure bash + POSIX find/sort/awk — no runtime dependencies.
      # Walks the entire repo, discovers every GitHubDB-managed directory
      # (any basePath, any depth, collections, subcollections, _kv, _auth),
      # and atomically rewrites each _index.json in the exact format the
      # library expects.
      - name: Rebuild all _index.json files
        run: |
          # Internal filenames the library writes itself — never listed as data.
          INTERNAL="^(_index|_admin-exists|_public|_origins)\.json$"

          # ISO-8601 timestamp for updatedAt (e.g. 2026-03-27T20:32:50.816Z)
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%S).$(
            printf '%03d' $(( 10#$(date -u +%N | cut -c1-3) ))
          )Z"

          # Find every unique directory that contains at least one .json file,
          # excluding .git, .github, and node_modules at any depth.
          find . \
            \( -path './.git'         -o \
               -path './.github'      -o \
               -path './node_modules' \) -prune \
            -o -name '*.json' -not -name '_index.json' -print \
          | sed 's|/[^/]*$||' \
          | sort -u \
          | while IFS= read -r DIR; do

              # ── Collect data files for this directory ──────────────────────
              # List only direct children (not recursive), filter internals,
              # sort alphabetically — matches the library's [...currentSet].sort()
              mapfile -t FILES < <(
                find "$DIR" -maxdepth 1 -name '*.json' -printf '%f\n' \
                | grep -Ev "$INTERNAL" \
                | sort
              )

              INDEX="$DIR/_index.json"

              if [ ${#FILES[@]} -eq 0 ]; then
                # No data files left — remove stale index if present
                if [ -f "$INDEX" ]; then
                  rm -f "$INDEX"
                  echo "  removed   $INDEX"
                fi
                continue
              fi

              # ── Build the "files" JSON array with awk ─────────────────────
              # Produces:
              #   "files": [
              #     "alice.json",
              #     "bob.json"
              #   ]
              FILES_JSON="$(printf '%s\n' "${FILES[@]}" | awk '
                BEGIN { printf "  \"files\": [\n" }
                {
                  # Escape backslashes and double-quotes (safe for filenames)
                  gsub(/\\/, "\\\\"); gsub(/"/, "\\\"")
                  lines[NR] = "    \"" $0 "\""
                  count = NR
                }
                END {
                  for (i = 1; i <= count; i++) {
                    if (i < count) printf "%s,\n", lines[i]
                    else           printf "%s\n",  lines[i]
                  }
                  printf "  ]"
                }
              ')"

              # ── Assemble the full _index.json ──────────────────────────────
              NEW_CONTENT="$(printf '{\n%s,\n  "updatedAt": "%s"\n}\n' \
                "$FILES_JSON" "$TIMESTAMP")"

              # ── Skip write if file list is unchanged ───────────────────────
              # Compare only the files array from the existing index (if any)
              # to avoid spurious commits when only updatedAt would change.
              if [ -f "$INDEX" ]; then
                OLD_FILES="$(grep -o '"[^"]*\.json"' "$INDEX" \
                  | grep -Ev "$INTERNAL" | sort | tr -d '\n')"
                NEW_FILES="$(printf '%s\n' "${FILES[@]}" \
                  | awk '{printf "\"" $0 "\""}' | tr -d '\n')"
                if [ "$OLD_FILES" = "$NEW_FILES" ]; then
                  echo "  unchanged $INDEX"
                  continue
                fi
              fi

              # ── Atomic write via temp file + mv ───────────────────────────
              TMP="$(mktemp "$DIR/.index_tmp_XXXXXX")"
              printf '%s' "$NEW_CONTENT" > "$TMP"
              mv -f "$TMP" "$INDEX"
              echo "  updated   $INDEX  (${#FILES[@]} file(s))"
            done

          echo "Done."

      # ── Commit only if something changed ────────────────────────────────────
      - name: Commit updated indexes
        run: |
          git config user.name  "_indexer-bot"
          git config user.email "_indexer-bot@users.noreply.github.com"

          # Stage every _index.json change (new, modified, or deleted) repo-wide
          git add $(git ls-files --others --modified --exclude-standard | grep '_index\.json') 2>/dev/null || true
          git add $(git ls-files --deleted                              | grep '_index\.json') 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No index changes to commit."
            exit 0
          fi

          CHANGED=$(git diff --cached --name-only | grep -c '_index\.json' || true)
          git commit -m "chore: rebuild ${CHANGED} _index.json file(s) [skip ci]"
          git push